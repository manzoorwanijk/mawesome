name: Mirror action

# Publishes the pr-baseline action to its mirror repository when the action's own release lands.
# The trigger is the changesets tag, which the release workflow pushes with the App token;
# a dispatch with a version reconciles a release whose mirror run was lost, and recreating a missing tag by hand does the same.
on:
  push:
    tags: ['@mawesome/pr-baseline-action@*']
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version of @mawesome/pr-baseline-action to mirror, without a v (its changesets tag must exist)

# Releases never interleave; queued runs wait (up to GitHub's cap of 100 pending runs) instead of being dropped.
concurrency:
  group: mirror-action
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  # The action workspace names its own mirror, so a second action added here brings its own target.
  ACTION_DIR: actions/pr-baseline

jobs:
  mirror:
    name: Publish the action mirror
    runs-on: ubuntu-latest
    # Restrict this environment to the tag pattern @mawesome/pr-baseline@* and the main branch in the repo settings,
    # and protect that tag pattern with a ruleset that only the release App can bypass: the run executes the tagged commit.
    environment: action-mirror
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      # Full treeless history, so the ancestry check below can walk main back to the tagged commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      # The tag names the version; its commit must carry that action version and be on main, and is what this job builds.
      - name: Resolve the release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            version="${GITHUB_REF_NAME#@mawesome/pr-baseline-action@}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a release version: $version" >&2
            exit 1
          fi
          tag="refs/tags/@mawesome/pr-baseline-action@$version"
          listing="$(git ls-remote --exit-code origin "$tag" "$tag^{}")"
          sha="$(printf '%s\n' "$listing" | awk -v ref="$tag^{}" '$2 == ref { print $1 }')"
          if [ -z "$sha" ]; then
            sha="$(printf '%s\n' "$listing" | awk -v ref="$tag" '$2 == ref { print $1 }')"
          fi
          test -n "$sha"
          git fetch --quiet --filter=tree:0 origin "$sha" '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          git checkout --quiet "$sha"
          manifest="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.ACTION_DIR + "/package.json", "utf8")).version')"
          test "$manifest" = "$version"
          mirror="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.ACTION_DIR + "/package.json", "utf8")).mirror.repo')"
          printf '%s' "$mirror" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mirror=$mirror" >> "$GITHUB_OUTPUT"
          echo "mirror_owner=${mirror%%/*}" >> "$GITHUB_OUTPUT"
          echo "mirror_repo=${mirror#*/}" >> "$GITHUB_OUTPUT"
      # The same App as the release, installed on the mirror as well; the token is scoped to that one repository.
      - name: Mint a GitHub App token for the mirror
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.release.outputs.mirror_owner }}
          repositories: ${{ steps.release.outputs.mirror_repo }}
          permission-contents: write
      # The App's bot user, so the mirror commits are attributed to it like any App-made commit.
      - name: Resolve the App's bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          SLUG: ${{ steps.mirror-token.outputs.app-slug }}
        run: |
          id="$(gh api "users/${SLUG}[bot]" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # never restore a cache into a run that publishes
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the action bundle
        run: pnpm --filter '@mawesome/pr-baseline-action...' build
      # release.json records what this mirror commit was built from, so every release changes the tree.
      - name: Stage the mirror contents
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          rm -rf mirror-stage && mkdir mirror-stage
          for path in action.yml LICENSE README.md workflow-template.yml src dist; do
            cp -R "$ACTION_DIR/$path" mirror-stage/
          done
          printf '{\n  "private": true,\n  "type": "module"\n}\n' > mirror-stage/package.json
          printf '{\n  "version": "%s",\n  "upstream": "%s"\n}\n' "$VERSION" "$SHA" > mirror-stage/release.json
      - name: Prepare the mirror
        id: prepare
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          MIRROR: ${{ steps.release.outputs.mirror }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: >-
          node tools/repo/scripts/tag-action-mirror.ts prepare
          --mirror "https://github.com/$MIRROR.git"
          --version "$VERSION"
          --upstream "$SHA"
          --stage mirror-stage
      # One commit on the release branch carrying exactly the staged tree, attributed to the App's bot user.
      # Promote verifies that commit before anything moves, so this step is only asked to produce it.
      - name: Deploy to the release branch
        id: deploy
        if: steps.prepare.outputs.deploy == 'true'
        uses: manzoorwanijk/action-deploy-to-repo@22747a56cddfd415412e752b76b1dd0d1f33778b # v4.0.0
        with:
          src_dir: mirror-stage
          target_repo: ${{ steps.release.outputs.mirror }}
          target_dir: .
          target_branch: ${{ steps.prepare.outputs.target_branch }}
          access_token: ${{ steps.mirror-token.outputs.token }}
          git_user_name: ${{ steps.bot.outputs.name }}
          git_user_email: ${{ steps.bot.outputs.email }}
          cleanup_command: find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          commit_msg: |
            Release v${{ steps.release.outputs.version }}

            Upstream-Ref: ${{ steps.release.outputs.sha }}
      - name: Promote the release
        if: steps.prepare.outputs.deploy == 'true'
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          MIRROR: ${{ steps.release.outputs.mirror }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          DEPLOYED: ${{ steps.deploy.outputs.commit_sha }}
        run: >-
          node tools/repo/scripts/tag-action-mirror.ts promote
          --mirror "https://github.com/$MIRROR.git"
          --version "$VERSION"
          --upstream "$SHA"
          --stage mirror-stage
          --deployed "$DEPLOYED"
      - name: Remove the release branch
        if: always() && steps.prepare.outcome != 'skipped'
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
          MIRROR: ${{ steps.release.outputs.mirror }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          DEPLOYED: ${{ steps.deploy.outputs.commit_sha }}
        run: >-
          node tools/repo/scripts/tag-action-mirror.ts cleanup
          --mirror "https://github.com/$MIRROR.git"
          --version "$VERSION"
          --upstream "$SHA"
          --deployed "$DEPLOYED"
